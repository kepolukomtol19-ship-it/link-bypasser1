<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MomoBypas — Link Unlocker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Belakang (Anime City) -->
    <div class="bg-image"></div>
    <div class="overlay"></div>
    <div id="particles-js"></div>

    <div class="container">
        <!-- GAMBAR ANIME DI DALEM KOTAK -->
        <div class="waifu-bg"></div>

        <div class="content">
            <div class="header">
                <h1>MomoBypas<span class="dot">.</span></h1>
                <p>Bypass shortener, ad-gateway, dan paywall. Kilat.</p>
            </div>
            
            <div class="input-group">
                <input type="url" id="urlInput" placeholder="Paste link di sini..." autocomplete="off">
                <button id="btnBypass" onclick="doBypass()">
                    <span class="btn-text">Bypass</span>
                    <div id="loader" class="loader hidden"></div>
                </button>
            </div>

            <button id="btnOpen" onclick="openInNewTab()" class="hidden-btn" disabled>Buka Link Asli</button>

            <div class="log-container">
                <div class="log-header">
                    <span>System Log</span>
                    <div class="dots"><span></span><span></span><span></span></div>
                </div>
                <pre id="log">Menunggu input...</pre>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
