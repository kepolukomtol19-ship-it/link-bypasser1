<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Bypasser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Link Bypasser</h1>
            <p>Paste link, tekan Bypass. Lewatin redirect, shortener, dan paywall.</p>
        </div>
        
        <div class="input-group">
            <input type="url" id="urlInput" placeholder="https://adf.ly/xxxx atau https://link-susah.com" autocomplete="off">
            <button id="btnBypass" onclick="doBypass()">Bypass</button>
        </div>
        
        <button id="btnOpen" onclick="openInNewTab()" disabled>Buka Link Asli</button>

        <div class="log-container">
            <div class="log-header">Log Resolve:</div>
            <pre id="log">Menunggu input...</pre>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
